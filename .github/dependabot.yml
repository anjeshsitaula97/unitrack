version: 2
updates:
  # Runtime + dev dependencies. Minor/patch bumps are grouped into one PR to
  # keep noise low; major bumps and security updates always get their own PR.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # Keep the CI workflow's action versions current (checkout, setup-node, cache).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
