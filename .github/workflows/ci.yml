name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Build-time placeholders so any module that reads env during `next build`
      # does not fail. They are NOT real secrets (CI never talks to production).
      # Real values live in the deployment environment's secret store.
      JWT_SECRET: ci-placeholder-secret-0123456789abcdefghijklmnop
      ENCRYPTION_KEY: ci-placeholder-key-0123456789abcdefghijklmnopqr
      DATABASE_URL: mysql://user:pass@localhost:3306/unitrack
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` installs exactly from the committed package-lock.json — this is
      # the whole point of tracking the lockfile (reproducible builds).
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
